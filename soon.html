<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VibeRoomz - Coming Soon</title>
   <link rel="icon" type="image/png" sizes="184x184" href="VibeRooms_light.png">
<link rel="stylesheet" href="soon.css">
  <link rel="stylesheet" href="main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="vr-coming-body">

  <main class="vr-coming-page">

    <!-- TOP CONTROLS -->
    <div class="vr-coming-controls">

      <button
        class="vr-coming-control"
        id="comingRtlToggle"
        type="button"
        aria-label="Switch to RTL">
        <i data-lucide="arrow-right-left"></i>
      </button>

      <button
        class="vr-coming-control"
        id="comingThemeToggle"
        type="button"
        aria-label="Switch to dark mode">
        <i data-lucide="moon-star"></i>
      </button>

    </div>


    <!-- CARD -->
    <section class="vr-coming-card">

      <!-- LOGO -->
      <a
        href="index.html"
        class="vr-coming-logo"
        aria-label="VibeRoomz Home">

        <img
          id="comingLogo"
          src="VibeRooms_light.png"
          data-light-logo="VibeRooms_light.png"
          data-dark-logo="VibeRooms_dark.png"
          alt="VibeRoomz">

        <h1>
          Vibe<span>Roomz</span>
        </h1>

      </a>


      <!-- ANIMATED ICON -->
      <div class="vr-coming-icon">
        <span class="vr-coming-ring"></span>
        <i data-lucide="rocket"></i>
      </div>


      <div class="vr-coming-content">

        <span class="vr-coming-label">
          Something Exciting
        </span>

        <h2>
          Coming <span>Soon</span>
        </h2>

        <p>
          We're working on something special for your next
          unforgettable VibeRoomz experience.
        </p>

      </div>


      <!-- ANIMATED DOTS -->
      <div class="vr-coming-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>


      <div class="vr-coming-message">
        Stay tuned. The vibe is almost ready!
      </div>

    </section>

  </main>


  <script>
    document.addEventListener("DOMContentLoaded", () => {

    const themeToggle =
        document.getElementById("comingThemeToggle");

    const rtlToggle =
        document.getElementById("comingRtlToggle");

    const logo =
        document.getElementById("comingLogo");

    const html = document.documentElement;
    const body = document.body;

    const THEME_KEY = "theme";
    const DIRECTION_KEY = "direction";

    function refreshIcons() {
        if (
            window.lucide &&
            typeof window.lucide.createIcons === "function"
        ) {
            window.lucide.createIcons();
        }
    }

    function getStorage(key, fallback = null) {
        try {
            return localStorage.getItem(key) || fallback;
        } catch (error) {
            return fallback;
        }
    }

    function setStorage(key, value) {
        try {
            localStorage.setItem(key, value);

            /*
             * localStorage storage event does not fire
             * in the same document, so dispatch a custom event.
             */
            window.dispatchEvent(
                new CustomEvent("viberoomz-storage-change", {
                    detail: {
                        key,
                        value
                    }
                })
            );
        } catch (error) {
            console.log("Storage error:", error);
        }
    }

    /* =====================================================
       THEME
    ====================================================== */

    function updateTheme(theme) {
        const isDark = theme === "dark";

        body.classList.toggle("dark", isDark);

        if (themeToggle) {
            themeToggle.innerHTML = isDark
                ? '<i data-lucide="sun-medium"></i>'
                : '<i data-lucide="moon-star"></i>';

            themeToggle.setAttribute(
                "aria-label",
                isDark
                    ? "Switch to light mode"
                    : "Switch to dark mode"
            );

            themeToggle.setAttribute(
                "aria-pressed",
                String(isDark)
            );
        }

        if (logo) {
            const lightLogo =
                logo.dataset.lightLogo;

            const darkLogo =
                logo.dataset.darkLogo;

            if (isDark && darkLogo) {
                logo.src = darkLogo;
            } else if (!isDark && lightLogo) {
                logo.src = lightLogo;
            }
        }

        refreshIcons();
    }

    if (themeToggle) {
        themeToggle.addEventListener("click", () => {
            const currentTheme =
                body.classList.contains("dark")
                    ? "dark"
                    : "light";

            const newTheme =
                currentTheme === "dark"
                    ? "light"
                    : "dark";

            setStorage(THEME_KEY, newTheme);
            updateTheme(newTheme);
        });
    }

    /* =====================================================
       RTL
    ====================================================== */

    function updateRTL(direction) {
        const isRTL = direction === "rtl";

        html.setAttribute(
            "dir",
            isRTL ? "rtl" : "ltr"
        );

        if (rtlToggle) {
            rtlToggle.innerHTML =
                '<i data-lucide="arrow-right-left"></i>';

            rtlToggle.setAttribute(
                "aria-label",
                isRTL
                    ? "Switch to left-to-right layout"
                    : "Switch to right-to-left layout"
            );

            rtlToggle.setAttribute(
                "aria-pressed",
                String(isRTL)
            );
        }

        refreshIcons();
    }

    if (rtlToggle) {
        rtlToggle.addEventListener("click", () => {
            const currentDirection =
                html.getAttribute("dir") || "ltr";

            const newDirection =
                currentDirection === "rtl"
                    ? "ltr"
                    : "rtl";

            setStorage(DIRECTION_KEY, newDirection);
            updateRTL(newDirection);
        });
    }

    /* =====================================================
       SAME-PAGE SYNC
    ====================================================== */

    window.addEventListener(
        "viberoomz-storage-change",
        event => {
            const key = event.detail?.key;
            const value = event.detail?.value;

            if (key === THEME_KEY) {
                updateTheme(value || "light");
            }

            if (key === DIRECTION_KEY) {
                updateRTL(value || "ltr");
            }
        }
    );

    /* =====================================================
       OTHER TAB / PAGE SYNC
    ====================================================== */

    window.addEventListener("storage", event => {
        if (event.key === THEME_KEY) {
            updateTheme(event.newValue || "light");
        }

        if (event.key === DIRECTION_KEY) {
            updateRTL(event.newValue || "ltr");
        }
    });

    /* =====================================================
       INITIAL STATE
    ====================================================== */

    const savedTheme =
        getStorage(THEME_KEY) ||
        (window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
            ? "dark"
            : "light");

    const savedDirection =
        getStorage(DIRECTION_KEY) || "ltr";

    updateTheme(savedTheme);
    updateRTL(savedDirection);
    refreshIcons();
});
  </script>

</body>
</html>
