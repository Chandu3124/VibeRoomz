<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VibeRoomz - Page Not Found</title>
   <link rel="icon" type="image/png" sizes="184x184" href="VibeRooms_light.png">
<link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="error.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="vr-404-body">

  <main class="vr-404-page">

    <!-- TOP RIGHT CONTROLS -->
    <div class="vr-404-controls">

      <button
        class="vr-404-control"
        id="errorRtlToggle"
        type="button"
        aria-label="Switch to RTL"
        aria-pressed="false">
        <i data-lucide="arrow-right-left"></i>
      </button>

      <button
        class="vr-404-control"
        id="errorThemeToggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false">
        <i data-lucide="moon-star"></i>
      </button>

    </div>


    <!-- 404 CARD -->
    <section class="vr-404-card">

      <div class="vr-404-icon">
        <i data-lucide="search-x"></i>
      </div>

      <div class="vr-404-number">
        4<span>0</span>4
      </div>

      <h1>
        Page <span>Not Found</span>
      </h1>

      <p>
        Sorry, the page you're looking for doesn't exist
        or may have been moved.
      </p>

      <a href="index.html" class="vr-404-home">
        <i data-lucide="house"></i>
        <span>Back to Home</span>
      </a>

    </section>

  </main>

  <script>
   document.addEventListener("DOMContentLoaded", () => {
    const themeToggle =
        document.getElementById("errorThemeToggle");

    const rtlToggle =
        document.getElementById("errorRtlToggle");

    const html = document.documentElement;
    const body = document.body;

    const THEME_KEY = "theme";
    const DIRECTION_KEY = "direction";

    function refreshIcons() {
        if (
            window.lucide &&
            typeof window.lucide.createIcons === "function"
        ) {
            window.lucide.createIcons();
        }
    }

    function getStorage(key, fallback = null) {
        try {
            return localStorage.getItem(key) || fallback;
        } catch (error) {
            return fallback;
        }
    }

    function setStorage(key, value) {
        try {
            localStorage.setItem(key, value);

            /*
             * The native storage event does not fire in the
             * same page that changes localStorage.
             */
            window.dispatchEvent(
                new CustomEvent("viberoomz-storage-change", {
                    detail: {
                        key,
                        value
                    }
                })
            );
        } catch (error) {
            console.log("Storage error:", error);
        }
    }

    /* =====================================================
       THEME
    ====================================================== */

    function updateTheme(theme) {
        const isDark = theme === "dark";

        body.classList.toggle("dark", isDark);

        if (themeToggle) {
            themeToggle.innerHTML = isDark
                ? '<i data-lucide="sun-medium"></i>'
                : '<i data-lucide="moon-star"></i>';

            themeToggle.setAttribute(
                "aria-label",
                isDark
                    ? "Switch to light mode"
                    : "Switch to dark mode"
            );

            themeToggle.setAttribute(
                "aria-pressed",
                String(isDark)
            );
        }

        refreshIcons();
    }

    if (themeToggle) {
        themeToggle.addEventListener("click", () => {
            const currentTheme =
                body.classList.contains("dark")
                    ? "dark"
                    : "light";

            const newTheme =
                currentTheme === "dark"
                    ? "light"
                    : "dark";

            setStorage(THEME_KEY, newTheme);
            updateTheme(newTheme);
        });
    }

    /* =====================================================
       RTL
    ====================================================== */

    function updateRTL(direction) {
        const isRTL = direction === "rtl";

        html.setAttribute(
            "dir",
            isRTL ? "rtl" : "ltr"
        );

        if (rtlToggle) {
            rtlToggle.innerHTML =
                '<i data-lucide="arrow-right-left"></i>';

            rtlToggle.setAttribute(
                "aria-label",
                isRTL
                    ? "Switch to left-to-right layout"
                    : "Switch to right-to-left layout"
            );

            rtlToggle.setAttribute(
                "aria-pressed",
                String(isRTL)
            );
        }

        refreshIcons();
    }

    if (rtlToggle) {
        rtlToggle.addEventListener("click", () => {
            const currentDirection =
                html.getAttribute("dir") || "ltr";

            const newDirection =
                currentDirection === "rtl"
                    ? "ltr"
                    : "rtl";

            setStorage(DIRECTION_KEY, newDirection);
            updateRTL(newDirection);
        });
    }

    /* =====================================================
       SAME-PAGE SYNC
    ====================================================== */

    window.addEventListener(
        "viberoomz-storage-change",
        event => {
            const key = event.detail?.key;
            const value = event.detail?.value;

            if (key === THEME_KEY) {
                updateTheme(value || "light");
            }

            if (key === DIRECTION_KEY) {
                updateRTL(value || "ltr");
            }
        }
    );

    /* =====================================================
       OTHER TAB / PAGE SYNC
    ====================================================== */

    window.addEventListener("storage", event => {
        if (event.key === THEME_KEY) {
            updateTheme(event.newValue || "light");
        }

        if (event.key === DIRECTION_KEY) {
            updateRTL(event.newValue || "ltr");
        }
    });

    /* =====================================================
       INITIAL STATE
    ====================================================== */

    const savedTheme =
        getStorage(THEME_KEY) ||
        (window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
            ? "dark"
            : "light");

    const savedDirection =
        getStorage(DIRECTION_KEY) || "ltr";

    updateTheme(savedTheme);
    updateRTL(savedDirection);
    refreshIcons();
});
  </script>

</body>
</html>
